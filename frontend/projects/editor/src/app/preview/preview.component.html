<div class="bar" role="toolbar" [attr.aria-label]="i18n.t('ed.tabs.preview')">
  <nz-segmented [nzOptions]="widthOptions()" [ngModel]="width()" (ngModelChange)="width.set($event)" nzSize="small" [attr.aria-label]="i18n.t('ed.preview.width')" />
  <label class="switch">
    <nz-switch nzSize="small" [ngModel]="grantAll()" (ngModelChange)="setGrantAll($event)" />
    {{ i18n.t('ed.preview.grantAll') }}
  </label>
  <label class="switch" [attr.title]="i18n.t('ed.preview.liveDataHint')">
    <nz-switch nzSize="small" [ngModel]="liveData()" (ngModelChange)="setLiveData($event)" />
    {{ i18n.t('ed.preview.liveData') }}
  </label>
  <button nz-button nzSize="small" type="button" (click)="showParams.set(!showParams())" [attr.aria-expanded]="showParams()">{{ i18n.t('ed.preview.params') }}</button>
  <button nz-button nzSize="small" type="button" (click)="showLog.set(!showLog())" [attr.aria-expanded]="showLog()">
    {{ i18n.t('ed.preview.log') }} ({{ log.events().length }})
  </button>
  <button nz-button nzSize="small" type="button" [nzType]="selectMode() ? 'primary' : 'default'" (click)="selectMode.set(!selectMode())" [attr.aria-pressed]="selectMode()" [attr.title]="i18n.t('ed.preview.selectHint')">
    <span nz-icon nzType="select"></span>{{ i18n.t('ed.preview.select') }}
  </button>
  <button nz-button nzSize="small" type="button" (click)="reload()"><span nz-icon nzType="reload"></span>{{ i18n.t('ed.preview.reload') }}</button>
</div>

@if (showParams()) {
  <div class="params">
    <label for="preview-params">{{ i18n.t('ed.preview.paramsHint') }}</label>
    <ed-json-field fieldId="preview-params" [value]="$any(params())" [minRows]="2" (valueChange)="setParams($event)" />
  </div>
}

@if (showLog()) {
  <ol class="log" [attr.aria-label]="i18n.t('ed.preview.log')">
    @for (event of log.events(); track $index) {
      <li [class]="event.kind"><span class="kind">{{ i18n.t('ed.preview.event.' + event.kind) }}</span> {{ event.text }}</li>
    } @empty {
      <li class="none">{{ i18n.t('ed.preview.noEvents') }}</li>
    }
  </ol>
}

@if (stale()) {
  <nz-alert nzType="warning" nzShowIcon [nzMessage]="i18n.t('ed.preview.invalid')" class="stale" />
}

<div class="stage">
  <ed-preview-frame [state]="state()" [width]="frameWidth()" (selected)="picked($event)" (dropped)="dropped($event)" (moved)="moved($event)" (resized)="resized($event)" (logged)="log.add($event)" />
</div>
