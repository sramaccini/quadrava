<div class="center">
    <div class="ed-tabs-box">
  <nz-tabs nzType="card" nzTabPosition="bottom" nzSize="small" [nzSelectedIndex]="view() === 'json' ? 1 : 0" (nzSelectedIndexChange)="setView($event)" [nzAnimated]="false">
    <nz-tab [nzTitle]="i18n.t('ed.nav.preview')"></nz-tab>
    <nz-tab [nzTitle]="i18n.t('ed.tabs.json')"></nz-tab>
  </nz-tabs>
  <div class="view">
    @if (view() === 'json') {
      <ed-json-view />
    }
    <div class="preview" [class.off]="view() === 'json'">
      <section class="profile ed-panel" [attr.aria-label]="i18n.t('ed.nav.profile')">
        <h2 class="ed-panel-title"><span nz-icon nzType="idcard" aria-hidden="true"></span>{{ i18n.t('ed.nav.profile') }}</h2>
        <div class="ed-panel-body">
        <label class="switch">
          <nz-switch nzSize="small" [ngModel]="granted() === null" (ngModelChange)="setGrantAll($event)" />
          {{ i18n.t('ed.preview.grantAll') }}
        </label>
        @if (granted() !== null) {
          <ul class="permissions">
            @for (permission of store.permissions(); track permission) {
              <li>
                <label nz-checkbox [ngModel]="has(permission)" (ngModelChange)="toggle(permission, $event)">
                  <code>{{ permission }}</code>
                </label>
              </li>
            } @empty {
              <li class="none">{{ i18n.t('ed.nav.noPermissions') }}</li>
            }
          </ul>
        }
        <p class="help">{{ i18n.t('ed.nav.profileHint') }}</p>
        </div>
      </section>
      <div class="menu">
        <ed-preview-frame [state]="previewState()" />
      </div>
    </div>
  </div>
  </div>
    </div>
