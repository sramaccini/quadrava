<nz-layout class="shell">
  <nz-header class="bar">
    <button nz-button nzType="text" class="trigger" type="button" [attr.aria-label]="collapsed() ? 'Espandi il menu' : 'Comprimi il menu'" [attr.aria-expanded]="!collapsed()" (click)="collapsed.set(!collapsed())">
      <lc-icon name="menu" />
    </button>
    <span class="crumb">Piattaforma LowCode · demo</span>
    <span class="spacer"></span>
    <label for="lc-user">Utente</label>
    <nz-select nzId="lc-user" nzSize="small" class="pick" [ngModel]="session.username()" (ngModelChange)="session.username.set($event)">
      @for (p of profiles; track p) {
        <nz-option [nzValue]="p" [nzLabel]="p" />
      }
    </nz-select>
    <label for="lc-theme">Tema</label>
    <nz-select nzId="lc-theme" nzSize="small" class="pick" [ngModel]="themeName()" (ngModelChange)="themeName.set($event)">
      @for (t of themes; track t) {
        <nz-option [nzValue]="t" [nzLabel]="t" />
      }
    </nz-select>
    <span class="perms" [attr.title]="permissions().join(', ')">{{ permissions().length }} permessi</span>
  </nz-header>

  <nz-layout class="body">
    @if (navigation.runtime(); as nav) {
      <lc-sidebar
        [navigation]="nav"
        brand="LowCode"
        [tone]="siderTone()"
        [showToggle]="false"
        [(collapsed)]="collapsed"
        [useCaseId]="navigation.current().useCase"
        [active]="active()"
        [hrefFor]="hrefFor"
        (navigate)="navigation.open($event.useCase, $event.leaf.screen, $event.leaf.params)"
        (useCaseChange)="navigation.switchUseCase($event)"
      />
    }
    <nz-content>
      <main>
        <router-outlet />
      </main>
    </nz-content>
  </nz-layout>

  @if (diagnostics.events().length) {
    <nz-footer class="diag">Segnalazioni tecniche: {{ diagnostics.events().length }} (dettagli nella console del browser)</nz-footer>
  }
</nz-layout>
