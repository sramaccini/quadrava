<header class="bar">
  <strong>Piattaforma LowCode — demo</strong>
  <label>
    Utente
    <select (change)="session.username.set(value($event))">
      @for (p of profiles; track p) {
        <option [value]="p" [selected]="p === session.username()">{{ p }}</option>
      }
    </select>
  </label>
  <label>
    Tema
    <select (change)="themeName.set(value($event))">
      @for (t of themes; track t) {
        <option [value]="t" [selected]="t === themeName()">{{ t }}</option>
      }
    </select>
  </label>
  <span class="perms" title="Permessi del profilo selezionato">{{ permissions().join(', ') }}</span>
</header>

<div class="body">
  @if (navigation.runtime(); as nav) {
    <lc-sidebar
      [navigation]="nav"
      [useCaseId]="navigation.current().useCase"
      [active]="active()"
      [hrefFor]="hrefFor"
      (navigate)="navigation.open($event.useCase, $event.leaf.screen, $event.leaf.params)"
      (useCaseChange)="navigation.switchUseCase($event)"
    />
  }
  <main>
    <router-outlet />
  </main>
</div>

<div class="toasts" role="status" aria-live="polite">
  @for (t of notifier.toasts(); track t.id) {
    <div class="toast" [class.error]="t.kind === 'error'">{{ t.message }}</div>
  }
</div>

@if (diagnostics.events().length) {
  <footer class="diag">Segnalazioni tecniche: {{ diagnostics.events().length }} (dettagli nella console del browser)</footer>
}
