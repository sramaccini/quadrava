[package]
name = "quadrava-studio"
version = "0.1.0"
description = "Quadrava Studio, the visual editor of Quadrava, as a desktop application"
authors = ["Simone Ramaccini"]
license = "MPL-2.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: Inspect (right click, or Ctrl+Shift+I) also in the installed app, to read the errors of Studio while the
# desktop app is young.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
