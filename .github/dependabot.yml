# Weekly update proposals for the dependencies of the repository, one pull request per group. Security updates are
# opened at once, regardless of the schedule. Angular and NG-ZORRO move together: a major version of either is a
# piece of work of its own (DEVELOPMENT-GUIDE § 3, `npm run nz:dark` after an NG-ZORRO update).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The framework moves in one pull request: a dependency-type group would otherwise take its packages too, and half of
    # Angular at a new version does not install. The other groups leave them out explicitly.
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', 'ng-zorro-antd', 'typescript']
      development:
        dependency-type: development
        exclude-patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', 'ng-zorro-antd', 'typescript']
      production:
        dependency-type: production
        exclude-patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular', 'angular-eslint', 'ng-zorro-antd', 'typescript']
    ignore:
      # Major versions of the framework are planned, not merged from a bot; TypeScript follows the versions Angular supports.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: ng-zorro-antd
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The types of Node follow the version of Node the project uses (.nvmrc, 24 LTS).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /reference/bff-node
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /reference
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
    ignore:
      # authz-library comes from GitHub Packages, which Dependabot cannot read without a token: it moves by hand.
      - dependency-name: 'com.logicwarez.authz:*'

  - package-ecosystem: docker
    directory: /docker/runtime
    schedule:
      interval: weekly
    ignore:
      # The build stage stays on the Node LTS of the project (.nvmrc); a new major is a choice, not a bot update.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directories: [/idp, /docker/bff-lite-proxy]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
