name: Security

# A search for secrets in the commits with gitleaks, on every push to main, on pull requests and once a week (the whole
# history); a secret found fails the job. Static analysis is CodeQL in the default setup of the repository (Settings ›
# Code security: JavaScript/TypeScript, Java and Actions, weekly and on pull requests), whose findings appear under
# Security › Code scanning: GitHub refuses a second, advanced CodeQL configuration next to it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history on main, so that a push of several commits is checked commit by commit.
          fetch-depth: 0
      - name: gitleaks
        # The official image at a fixed version: the commits of the push or of the pull request, or the whole history.
        run: |
          range=''
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="--log-opts=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = push ] && [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="--log-opts=${{ github.event.before }}..${{ github.sha }}"
          fi
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --no-banner --redact $range
