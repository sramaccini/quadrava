name: Desktop

# Quadrava Studio as a desktop application (ADR-17): one machine per operating system builds the installers, because
# Tauri does not cross-compile (macOS packages are built only on macOS). The installers are not signed: Windows
# SmartScreen and macOS Gatekeeper warn the first time they are opened.
#
# Studio is moving to the commercial edition (ADR-21): this workflow runs only by hand until it leaves this repository.

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Studio for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
          - name: macOS
            os: macos-latest
            # One package for Apple silicon and Intel.
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run demo:prepare
      - run: npx ng build editor
      # The runtime bundled with Studio, for «Run project» in a window of the app.
      - run: npx ng build runtime --base-href /runtime/ --output-path dist/runtime-desktop
      - run: node tools/desktop-runtime.mjs
      - name: Installers
        working-directory: frontend/desktop
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: quadrava-studio-${{ matrix.name }}
          path: |
            frontend/desktop/src-tauri/target/release/bundle/
            frontend/desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
