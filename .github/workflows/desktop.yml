name: Desktop

# Quadrava Studio as a desktop application (ADR-17): one machine per operating system builds the installers, because
# Tauri does not cross-compile (macOS packages are built only on macOS). Started by hand, on a «studio-v*» tag, and on
# changes to Studio or to the desktop project. The installers are not signed: Windows SmartScreen and macOS Gatekeeper warn the first
# time they are opened.

on:
  workflow_dispatch:
  push:
    tags: ['studio-v*']
    branches: [main]
    # The app holds the whole of Studio: it is built again when Studio, the libraries it uses or the desktop project change.
    paths:
      - 'frontend/desktop/**'
      - 'frontend/projects/editor/**'
      - 'frontend/projects/schema/**'
      - 'frontend/projects/expressions/**'
      - 'frontend/projects/core/**'
      - 'frontend/projects/components/**'
      - 'frontend/package-lock.json'
      - 'examples/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Studio for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: Linux
            os: ubuntu-22.04
            args: ''
          - name: macOS
            os: macos-latest
            # One package for Apple silicon and Intel.
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/desktop/src-tauri -> target
      - run: npm ci
      - run: npm run demo:prepare
      - run: npx ng build editor
      - name: Installers
        working-directory: frontend/desktop
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: quadrava-studio-${{ matrix.name }}
          path: |
            frontend/desktop/src-tauri/target/release/bundle/
            frontend/desktop/src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: error
