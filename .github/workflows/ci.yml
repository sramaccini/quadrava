name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before publishing (ADR-20).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (schema, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm run schema:check
      - run: npm run schema:docs:check
      - run: npm run validate:examples
      - run: npm run cli:test
      - run: npm run notices:check
      - run: npm run build:libs
      - run: node tools/copy-examples.mjs
      - run: npx ng test schema --watch=false
      - run: npx ng test expressions --watch=false
      - run: npx ng test core --watch=false
      - run: npx ng test components --watch=false
      - run: npx ng test services --watch=false
      - run: npx ng test runtime --watch=false
      - run: npx ng build runtime

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run demo:prepare
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  image:
    name: Runtime image (build and start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime/Dockerfile
          load: true
          tags: quadrava-runtime:ci
      # The demo, then the registry with the BFF paths: the configuration written at start-up and the routes of the screens.
      - name: Start the image
        run: |
          docker run -d --name demo -p 8081:8080 quadrava-runtime:ci
          docker run -d --name registry -p 8082:8080 --add-host bff.test:127.0.0.1 \
            -e QUADRAVA_REGISTRY_APP=demo -e QUADRAVA_NAVIGATION=invoicing -e QUADRAVA_THEMES=light,dark \
            -e QUADRAVA_BFF_URL=http://bff.test:8080 quadrava-runtime:ci
          sleep 3
          curl -fsS http://localhost:8081/runtime-config.json | grep -q '"examples"'
          curl -fsS http://localhost:8081/some/screen | grep -q '<lc-root'
          curl -fsS http://localhost:8082/runtime-config.json | grep -q '"registry"'
          # Uploads up to the largest file field pass nginx; the limit is a setting of the image.
          docker exec registry grep -q 'client_max_body_size 100m;' /etc/nginx/quadrava/bff.conf
          if docker run --rm -e QUADRAVA_REGISTRY_APP='bad"name' quadrava-runtime:ci; then echo 'a wrong value must stop the container'; exit 1; fi
          if docker run --rm -e QUADRAVA_BFF_URL=http://bff.test:8080 -e QUADRAVA_MAX_BODY_SIZE=10mb quadrava-runtime:ci; then echo 'a wrong size must stop the container'; exit 1; fi
      - if: failure()
        run: docker logs demo; docker logs registry

  java:
    name: Reference implementation (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  conformance:
    name: Conformance kits (reference services)
    runs-on: ubuntu-latest
    env:
      # Two tenants on the BFF, so the kit checks the tenant switch too (contracts/bff.yaml).
      QUADRAVA_BFF_TENANTS_0_ID: north
      QUADRAVA_BFF_TENANTS_0_LABEL: North office
      QUADRAVA_BFF_TENANTS_0_USERS_0: administrator
      QUADRAVA_BFF_TENANTS_1_ID: south
      QUADRAVA_BFF_TENANTS_1_LABEL: South office
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Keycloak with the development realm, and the reference services as npm run stack starts them.
      - run: docker compose up -d
        working-directory: idp
      - run: mvn -B -q package -DskipTests
        working-directory: reference
      - name: Start the reference services
        working-directory: reference
        run: |
          mkdir -p ../.stack/logs
          for module in authz telemetry bff; do
            nohup java -jar $module/target/quadrava-reference-$module-*.jar > ../.stack/logs/$module.log 2>&1 &
          done
          wait_for() { for i in $(seq 1 120); do curl -s -o /dev/null "$1" && return 0; sleep 2; done; echo "$1 does not answer"; return 1; }
          wait_for http://localhost:8180/realms/quadrava/.well-known/openid-configuration
          wait_for http://localhost:8082/actuator/health
          wait_for http://localhost:8083/actuator/health
          wait_for http://localhost:8080/actuator/health
      - run: node tools/conformance.mjs
        working-directory: frontend
      - if: failure()
        run: tail -n 100 .stack/logs/*.log; docker compose -f idp/docker-compose.yml logs --tail 100
