name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same checks before publishing (ADR-20).
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (schema, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm run schema:check
      - run: npm run schema:docs:check
      - run: npm run validate:examples
      - run: npm run cli:test
      - run: npm run notices:check
      - run: npm run nz:dark:check
      - run: npm run build:libs
      - run: node tools/copy-examples.mjs
      - run: npx ng test schema --watch=false
      - run: npx ng test expressions --watch=false
      - run: npx ng test core --watch=false
      - run: npx ng test components --watch=false
      - run: npx ng test services --watch=false
      - run: npx ng test runtime --watch=false
      - run: npx ng build runtime

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run demo:prepare
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  image:
    name: Runtime image (build and start)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/runtime/Dockerfile
          load: true
          tags: quadrava-runtime:ci
      # The demo, then the registry with the BFF paths: the configuration written at start-up and the routes of the screens.
      - name: Start the image
        run: |
          docker run -d --name demo -p 8081:8080 quadrava-runtime:ci
          docker run -d --name registry -p 8082:8080 --add-host bff.test:127.0.0.1 \
            -e QUADRAVA_REGISTRY_APP=demo -e QUADRAVA_NAVIGATION=invoicing -e QUADRAVA_THEMES=light,dark \
            -e QUADRAVA_BFF_URL=http://bff.test:8080 quadrava-runtime:ci
          sleep 3
          curl -fsS http://localhost:8081/runtime-config.json | grep -q '"examples"'
          curl -fsS http://localhost:8081/some/screen | grep -q '<lc-root'
          curl -fsS http://localhost:8082/runtime-config.json | grep -q '"registry"'
          # Uploads up to the largest file field pass nginx; the limit is a setting of the image.
          docker exec registry grep -q 'client_max_body_size 100m;' /etc/nginx/quadrava/bff.conf
          # nginx runs without root (master and workers).
          test "$(docker exec demo id -u)" = 101
          if docker exec demo ps -o user= | grep -q root; then echo 'nginx must not run as root'; exit 1; fi
          # The policy of the page on the files of the runtime; Strict-Transport-Security only when asked.
          curl -fsSI http://localhost:8081/some/screen | grep -qi "^content-security-policy: default-src 'self'; script-src 'self';"
          curl -fsSI http://localhost:8081/runtime-config.json | grep -qi '^x-frame-options: SAMEORIGIN'
          if curl -fsSI http://localhost:8081/ | grep -qi '^strict-transport-security'; then echo 'no HSTS without QUADRAVA_HSTS'; exit 1; fi
          # The nonce of the style elements: the same in the header and in the page, another in the next answer.
          page=$(curl -fsSi http://localhost:8081/some/screen)
          nonce=$(printf '%s' "$page" | grep -io "'nonce-[0-9a-f]*'" | head -1 | tr -d "'" | cut -c7-)
          test -n "$nonce"
          printf '%s' "$page" | grep -q "<lc-root ngCspNonce=\"$nonce\""
          if curl -fsS http://localhost:8081/ | grep -q "ngCspNonce=\"$nonce\""; then echo 'a nonce must not be used twice'; exit 1; fi
          printf '%s' "$page" | grep -qi "img-src 'self' data:;"
          docker run -d --name hsts -p 8083:8080 -e QUADRAVA_HSTS='max-age=31536000; includeSubDomains' \
            -e QUADRAVA_CSP_IMG_SRC='https://cdn.example.com https://*.images.example' quadrava-runtime:ci
          sleep 2
          curl -fsSI http://localhost:8083/ | grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains'
          curl -fsSI http://localhost:8083/ | grep -qi "img-src 'self' data: https://cdn.example.com https://\*.images.example;"
          if docker run --rm -e QUADRAVA_CSP_IMG_SRC=http://x.example quadrava-runtime:ci; then echo 'a wrong image source must stop the container'; exit 1; fi
          if docker run --rm -e QUADRAVA_HSTS=forever quadrava-runtime:ci; then echo 'a wrong HSTS must stop the container'; exit 1; fi
          if docker run --rm -e QUADRAVA_REGISTRY_APP='bad"name' quadrava-runtime:ci; then echo 'a wrong value must stop the container'; exit 1; fi
          if docker run --rm -e QUADRAVA_BFF_URL=http://bff.test:8080 -e QUADRAVA_MAX_BODY_SIZE=10mb quadrava-runtime:ci; then echo 'a wrong size must stop the container'; exit 1; fi
          if docker run --rm -e QUADRAVA_TRUST_FORWARDED=yes quadrava-runtime:ci; then echo 'a wrong QUADRAVA_TRUST_FORWARDED must stop the container'; exit 1; fi
      # The forwarded headers the BFF gets, from a server that answers with the headers of the request: those of this
      # image, or with QUADRAVA_TRUST_FORWARDED those of a TLS terminator in front.
      - name: Forwarded headers
        run: |
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Echo(BaseHTTPRequestHandler):
              def do_GET(self):
                  body = ''.join(f'{k}: {v}\n' for k, v in self.headers.items()).encode()
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          HTTPServer(('0.0.0.0', 9099), Echo).serve_forever()
          PY
          docker run -d --name own -p 8084:8080 --add-host bff.test:host-gateway \
            -e QUADRAVA_BFF_URL=http://bff.test:9099 quadrava-runtime:ci
          docker run -d --name trusted -p 8085:8080 --add-host bff.test:host-gateway \
            -e QUADRAVA_BFF_URL=http://bff.test:9099 -e QUADRAVA_TRUST_FORWARDED=true quadrava-runtime:ci
          sleep 3
          tls='-H X-Forwarded-Proto:https -H X-Forwarded-Host:app.example'
          curl -fsS $tls http://localhost:8084/bff/user | grep -qi '^x-forwarded-proto: http$'
          curl -fsS $tls http://localhost:8084/bff/user | grep -qi '^x-forwarded-host: localhost:8084$'
          curl -fsS $tls http://localhost:8085/bff/user | grep -qi '^x-forwarded-proto: https$'
          curl -fsS $tls http://localhost:8085/bff/user | grep -qi '^x-forwarded-host: app.example$'
          curl -fsS http://localhost:8085/bff/user | grep -qi '^x-forwarded-proto: http$'
          curl -fsS -H 'X-Forwarded-Proto: javascript' -H 'X-Forwarded-Host: a.example/evil' http://localhost:8085/bff/user > headers.txt
          grep -qi '^x-forwarded-proto: http$' headers.txt
          grep -qi '^x-forwarded-host: localhost:8085$' headers.txt
      - if: failure()
        run: docker logs demo; docker logs registry

  java:
    name: Reference implementation (Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: reference
    steps:
      - uses: actions/checkout@v7
      # authz-library (BFF) comes from GitHub Packages, which wants a token even for reading.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github-authz
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - run: mvn -B verify

  bff-node:
    name: Node BFF (unit tests and conformance)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/bff-node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: reference/bff-node/package-lock.json
      - run: npm ci
      - run: npm test
      # The kits of the BFF and of the authorization against this BFF, with Keycloak and the development realm. The
      # Node BFF takes port 8080, the callback registered in the realm; no Redis and no demo back end are needed.
      - run: docker compose up -d keycloak
        working-directory: idp
      - name: Start the Node BFF
        run: |
          mkdir -p ../../.stack/logs
          nohup npm start > ../../.stack/logs/bff-node.log 2>&1 &
          for i in $(seq 1 120); do curl -s -o /dev/null http://localhost:8080/bff/user && exit 0; sleep 2; done
          echo 'the Node BFF does not answer'; exit 1
      - run: node tools/conformance-bff.mjs --bff http://localhost:8080 --return http://localhost:4200/ --user administrator --password administrator
        working-directory: frontend
      - name: Authorization kit on the session of the BFF
        working-directory: frontend
        run: |
          login() { node --input-type=module -e "import { bffLogin } from './tools/conformance-lib.mjs'; console.log(await bffLogin('http://localhost:8080', '$1', '$1', 'http://localhost:4200/'))"; }
          node tools/conformance-authz.mjs --authz http://localhost:8080 --app demo --cookie "$(login operator)" --other-cookie "$(login manager)"
      - if: failure()
        run: tail -n 100 ../../.stack/logs/bff-node.log; docker compose -f ../../idp/docker-compose.yml logs --tail 100

  conformance:
    name: Conformance kits (reference services)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Two tenants on the BFF, so the kit checks the tenant switch too (contracts/bff.yaml).
      QUADRAVA_BFF_TENANTS_0_ID: north
      QUADRAVA_BFF_TENANTS_0_LABEL: North office
      QUADRAVA_BFF_TENANTS_0_USERS_0: administrator
      QUADRAVA_BFF_TENANTS_1_ID: south
      QUADRAVA_BFF_TENANTS_1_LABEL: South office
    steps:
      - uses: actions/checkout@v7
      # authz-library (BFF) comes from GitHub Packages, which wants a token even for reading.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github-authz
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Keycloak with the development realm, Redis, and the reference services as npm run stack starts them.
      - run: docker compose up -d
        working-directory: idp
      - run: mvn -B -q package -DskipTests
        working-directory: reference
      - name: Start the reference services
        working-directory: reference
        run: |
          mkdir -p ../.stack/logs
          wait_for() { for i in $(seq 1 120); do curl -s -o /dev/null "$1" && return 0; sleep 2; done; echo "$1 does not answer"; return 1; }
          # The BFF reads the discovery of Keycloak at start-up.
          wait_for http://localhost:8180/realms/quadrava/.well-known/openid-configuration
          for module in authz telemetry bff; do
            nohup java -jar $module/target/quadrava-reference-$module-*.jar > ../.stack/logs/$module.log 2>&1 &
          done
          wait_for http://localhost:8082/actuator/health
          wait_for http://localhost:8083/actuator/health
          wait_for http://localhost:8080/actuator/health
      - run: node tools/conformance.mjs
        working-directory: frontend
      - if: failure()
        run: tail -n 100 .stack/logs/*.log; docker compose -f idp/docker-compose.yml logs --tail 100
