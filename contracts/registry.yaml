openapi: 3.1.0
info:
  title: KinetiX - Contratto del registry
  version: 0.5.0
  description: >
    Registro delle definizioni delle applicazioni. Un'applicazione è fatta di documenti separati: ogni schermata,
    la navigazione e ogni tema sono un documento a sé, con le proprie versioni e le proprie pubblicazioni.
    Le versioni sono immutabili e identificate dall'hash del contenuto; pubblicare significa far puntare un ambiente
    a una versione di un documento. Il registry valida il contenuto contro lo schema del tipo di documento
    (screen.schema.json, navigation.schema.json, theme.schema.json) e rifiuta i documenti non validi.

    0.3: cataloghi delle traduzioni come documenti (kind messages, un documento per lingua); revisione delle versioni (bozza → in-revisione → approvata o respinta, con il principio dei quattro occhi),
    ambienti protetti in cui si pubblicano solo versioni approvate, salvataggio condizionato da If-Match per non
    sovrascrivere le modifiche di altri, errori di validazione dettagliati (`errors` nel Problem).

    0.4: controllo dei riferimenti tra documenti. La navigazione (`screen` delle voci) e le schermate (passi `navigate`,
    nodi `link` con `screen`) citano altre schermate per identificativo: `getReferences` dice quali sono e quali
    mancano in un ambiente; negli ambienti protetti una navigazione si pubblica solo se tutte le sue schermate sono
    pubblicate lì (altrimenti 409 con `missingReferences`). Per le schermate è solo un avviso, perché i collegamenti
    tra schermate formano spesso cicli (elenco e dettaglio).

    0.5 (non compatibile con 0.4): valori in inglese. Stati di revisione draft, in-review, approved, rejected; azioni
    request, approve, reject; ambienti di esempio development, testing, production.
  license:
    name: Proprietaria
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: registry
    description: Documenti delle applicazioni, versioni e pubblicazione.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /registry/apps:
    get:
      tags: [registry]
      operationId: listApps
      summary: Elenco delle applicazioni visibili all'utente
      responses:
        '200':
          description: Applicazioni.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [registry]
      operationId: listDocuments
      summary: Documenti dell'applicazione (schermate, navigazione, temi)
      parameters:
        - name: kind
          in: query
          required: false
          description: Solo i documenti di questo tipo.
          schema: { $ref: '#/components/schemas/DocumentKind' }
      responses:
        '200':
          description: Documenti, con l'ultima versione e gli ambienti in cui sono pubblicati.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [registry]
      operationId: listVersions
      summary: Storico delle versioni di un documento
      responses:
        '200':
          description: Versioni, dalla più recente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [registry]
      operationId: saveVersion
      summary: Salva una nuova versione del documento (immutabile)
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Hash (tra virgolette) dell'ultima versione nota al client.
          schema: { type: string }
      description: >
        Il contenuto si valida contro lo schema del tipo di documento (se non è valido: 400 con `errors`).
        L'identificativo nel contenuto (`screen`, `navigation` o `theme`) deve coincidere con `documentId`.
        Salvare due volte lo stesso contenuto restituisce la stessa versione. Con `If-Match` (l'hash dell'ultima
        versione che il client conosce) il salvataggio riesce solo se nessuno ha salvato nel frattempo; altrimenti 412.
        La versione nuova è una bozza.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentContent' }
      responses:
        '201':
          description: Versione creata (o già esistente con lo stesso contenuto).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412':
          description: Un altro salvataggio è arrivato prima; il Problem indica `latest` e `latestAuthor`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}/review:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [registry]
      operationId: reviewVersion
      summary: Cambia lo stato di revisione di una versione
      description: >
        `request`: da draft o rejected a in-review (chiunque possa scrivere). `approve` e `reject`: da
        in-review ad approved o rejected; solo chi ha un ruolo di revisore e non è l'autore della versione.
        Il contenuto della versione non cambia mai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Versione con il nuovo stato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Azione non ammessa nello stato attuale (per esempio approvare una bozza).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}/references:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
      - name: env
        in: query
        required: false
        description: >
          Ambiente in cui controllare i riferimenti: mancano le schermate senza una versione pubblicata lì. Senza
          ambiente mancano le schermate che nel registro dell'applicazione non esistono.
        schema: { type: string, examples: [development] }
    get:
      tags: [registry]
      operationId: getReferences
      summary: Schermate citate da una versione e quelle che mancano
      description: >
        Riferimenti per identificativo verso altre schermate: `screen` delle voci della navigazione, passi `navigate`
        e nodi `link` con `screen` delle schermate. Un riferimento della schermata a se stessa non conta, né un valore
        con un'espressione ({{ }}). Temi e cataloghi non hanno riferimenti.
      responses:
        '200':
          description: Riferimenti della versione.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      operationId: getVersion
      summary: Contenuto di una versione
      responses:
        '200':
          description: Documento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/published:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: env
        in: query
        required: true
        schema: { type: string, examples: [production] }
    get:
      tags: [registry]
      operationId: getPublished
      summary: Versione pubblicata di un documento in un ambiente (con ETag)
      description: Il runtime carica così ogni schermata, la navigazione e il tema, ognuno quando serve.
      responses:
        '200':
          description: Documento pubblicato.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '304': { description: Non modificato. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [registry]
      operationId: publish
      summary: Pubblica una versione del documento in un ambiente
      description: >
        Negli ambienti protetti (di norma collaudo e produzione) si pubblicano solo versioni approvate (altrimenti 409)
        e una navigazione si pubblica solo se le schermate che cita sono già pubblicate nello stesso ambiente
        (altrimenti 409 con `missingReferences`). Negli altri ambienti la pubblicazione riesce comunque: i riferimenti
        mancanti si leggono prima con `getReferences`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '204': { description: Pubblicato. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: >
            Ambiente protetto e versione non approvata, oppure navigazione con schermate non pubblicate
            nell'ambiente (`missingReferences`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LOWCODE_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    Kind:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DocumentKind' }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Identificativo del documento (kebab-case), uguale a `screen`, `navigation` o `theme` nel contenuto.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
  responses:
    Problem:
      description: Errore in formato RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    DocumentKind:
      type: string
      enum: [screen, navigation, theme, messages]
      description: Tipo di documento, che decide lo schema di validazione (messages = catalogo delle traduzioni di una lingua, schema messages.schema.json).
    AppSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        documentCount: { type: integer, minimum: 0 }
    DocumentSummary:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        id: { type: string }
        latest:
          description: Ultima versione salvata.
          $ref: '#/components/schemas/DocumentVersion'
        publishedEnvironments:
          type: object
          description: Ambiente → hash della versione pubblicata.
          additionalProperties: { type: string }
    DocumentContent:
      type: object
      description: >
        Il documento JSON (una schermata, la navigazione o un tema), validato contro lo schema del suo tipo.
      required: [schemaVersion]
      properties:
        schemaVersion: { type: string }
      additionalProperties: true
    DocumentVersion:
      type: object
      required: [hash, createdAt, author]
      properties:
        hash: { type: string, description: Hash del contenuto. }
        createdAt: { type: string, format: date-time }
        author: { type: string }
        state:
          type: string
          enum: [draft, in-review, approved, rejected]
          description: Stato di revisione. Dove è pubblicata lo dice `publishedEnvironments` del documento.
        reviewedBy: { type: string, description: Chi ha approvato o respinto. }
        reviewedAt: { type: string, format: date-time }
        reviewNote: { type: string, maxLength: 500 }
    ReviewRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [request, approve, reject] }
        note: { type: string, maxLength: 500 }
    ScreenReference:
      type: object
      required: [screen, path]
      properties:
        screen: { type: string, description: Identificativo della schermata citata. }
        path: { type: string, description: Posizione del riferimento nel documento (JSON Pointer). }
    ReferenceReport:
      type: object
      required: [references, missing]
      properties:
        env: { type: string, description: Ambiente controllato; assente se il controllo è sull'esistenza. }
        references:
          type: array
          description: Tutti i riferimenti della versione, nell'ordine del documento.
          items: { $ref: '#/components/schemas/ScreenReference' }
        missing:
          type: array
          description: I riferimenti a schermate non pubblicate nell'ambiente (o inesistenti, senza ambiente).
          items: { $ref: '#/components/schemas/ScreenReference' }
    PublishRequest:
      type: object
      required: [hash]
      properties:
        hash: { type: string }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          description: Problemi di validazione del documento (posizione JSON Pointer e messaggio).
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        latest: { type: string, description: Con 412, hash dell'ultima versione. }
        latestAuthor: { type: string, description: Con 412, autore dell'ultima versione. }
        missingReferences:
          type: array
          description: Con 409 alla pubblicazione, le schermate citate e non pubblicate nell'ambiente.
          items: { $ref: '#/components/schemas/ScreenReference' }
