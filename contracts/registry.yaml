openapi: 3.1.0
info:
  title: Piattaforma LowCode - Contratto del registry
  version: 0.3.0
  description: >
    Registro delle definizioni delle applicazioni. Un'applicazione è fatta di documenti separati: ogni schermata,
    la navigazione e ogni tema sono un documento a sé, con le proprie versioni e le proprie pubblicazioni.
    Le versioni sono immutabili e identificate dall'hash del contenuto; pubblicare significa far puntare un ambiente
    a una versione di un documento. Il registry valida il contenuto contro lo schema del tipo di documento
    (screen.schema.json, navigation.schema.json, theme.schema.json) e rifiuta i documenti non validi.

    0.3: revisione delle versioni (bozza → in-revisione → approvata o respinta, con il principio dei quattro occhi),
    ambienti protetti in cui si pubblicano solo versioni approvate, salvataggio condizionato da If-Match per non
    sovrascrivere le modifiche di altri, errori di validazione dettagliati (`errors` nel Problem).
  license:
    name: Proprietaria
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: registry
    description: Documenti delle applicazioni, versioni e pubblicazione.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /registry/apps:
    get:
      tags: [registry]
      operationId: listApps
      summary: Elenco delle applicazioni visibili all'utente
      responses:
        '200':
          description: Applicazioni.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [registry]
      operationId: listDocuments
      summary: Documenti dell'applicazione (schermate, navigazione, temi)
      parameters:
        - name: kind
          in: query
          required: false
          description: Solo i documenti di questo tipo.
          schema: { $ref: '#/components/schemas/DocumentKind' }
      responses:
        '200':
          description: Documenti, con l'ultima versione e gli ambienti in cui sono pubblicati.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [registry]
      operationId: listVersions
      summary: Storico delle versioni di un documento
      responses:
        '200':
          description: Versioni, dalla più recente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [registry]
      operationId: saveVersion
      summary: Salva una nuova versione del documento (immutabile)
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Hash (tra virgolette) dell'ultima versione nota al client.
          schema: { type: string }
      description: >
        Il contenuto si valida contro lo schema del tipo di documento (se non è valido: 400 con `errors`).
        L'identificativo nel contenuto (`screen`, `navigation` o `theme`) deve coincidere con `documentId`.
        Salvare due volte lo stesso contenuto restituisce la stessa versione. Con `If-Match` (l'hash dell'ultima
        versione che il client conosce) il salvataggio riesce solo se nessuno ha salvato nel frattempo; altrimenti 412.
        La versione nuova è una bozza.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentContent' }
      responses:
        '201':
          description: Versione creata (o già esistente con lo stesso contenuto).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412':
          description: Un altro salvataggio è arrivato prima; il Problem indica `latest` e `latestAuthor`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}/review:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [registry]
      operationId: reviewVersion
      summary: Cambia lo stato di revisione di una versione
      description: >
        `richiedi`: da bozza o respinta a in-revisione (chiunque possa scrivere). `approva` e `respingi`: da
        in-revisione ad approvata o respinta; solo chi ha un ruolo di revisore e non è l'autore della versione.
        Il contenuto della versione non cambia mai.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Versione con il nuovo stato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Azione non ammessa nello stato attuale (per esempio approvare una bozza).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      operationId: getVersion
      summary: Contenuto di una versione
      responses:
        '200':
          description: Documento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/published:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: env
        in: query
        required: true
        schema: { type: string, examples: [produzione] }
    get:
      tags: [registry]
      operationId: getPublished
      summary: Versione pubblicata di un documento in un ambiente (con ETag)
      description: Il runtime carica così ogni schermata, la navigazione e il tema, ognuno quando serve.
      responses:
        '200':
          description: Documento pubblicato.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '304': { description: Non modificato. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [registry]
      operationId: publish
      summary: Pubblica una versione del documento in un ambiente
      description: Negli ambienti protetti (di norma collaudo e produzione) si pubblicano solo versioni approvate (altrimenti 409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '204': { description: Pubblicato. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Ambiente protetto e versione non approvata.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LOWCODE_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    Kind:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DocumentKind' }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Identificativo del documento (kebab-case), uguale a `screen`, `navigation` o `theme` nel contenuto.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
  responses:
    Problem:
      description: Errore in formato RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    DocumentKind:
      type: string
      enum: [screen, navigation, theme]
      description: Tipo di documento, che decide lo schema di validazione.
    AppSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        documentCount: { type: integer, minimum: 0 }
    DocumentSummary:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        id: { type: string }
        latest:
          description: Ultima versione salvata.
          $ref: '#/components/schemas/DocumentVersion'
        publishedEnvironments:
          type: object
          description: Ambiente → hash della versione pubblicata.
          additionalProperties: { type: string }
    DocumentContent:
      type: object
      description: >
        Il documento JSON (una schermata, la navigazione o un tema), validato contro lo schema del suo tipo.
      required: [schemaVersion]
      properties:
        schemaVersion: { type: string }
      additionalProperties: true
    DocumentVersion:
      type: object
      required: [hash, createdAt, author]
      properties:
        hash: { type: string, description: Hash del contenuto. }
        createdAt: { type: string, format: date-time }
        author: { type: string }
        state:
          type: string
          enum: [bozza, in-revisione, approvata, respinta]
          description: Stato di revisione. Dove è pubblicata lo dice `publishedEnvironments` del documento.
        reviewedBy: { type: string, description: Chi ha approvato o respinto. }
        reviewedAt: { type: string, format: date-time }
        reviewNote: { type: string, maxLength: 500 }
    ReviewRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [richiedi, approva, respingi] }
        note: { type: string, maxLength: 500 }
    PublishRequest:
      type: object
      required: [hash]
      properties:
        hash: { type: string }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          description: Problemi di validazione del documento (posizione JSON Pointer e messaggio).
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        latest: { type: string, description: Con 412, hash dell'ultima versione. }
        latestAuthor: { type: string, description: Con 412, autore dell'ultima versione. }
