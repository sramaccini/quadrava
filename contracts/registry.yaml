openapi: 3.1.0
info:
  title: Quadrava - Registry contract
  version: 0.6.0
  description: >
    Registry of the application definitions. An application is made of separate documents: every screen, every data
    sources document, the navigation and every theme are documents of their own, with their own versions and publications.
    Versions are immutable and identified by the hash of their content; publishing means pointing an environment at a
    version of a document. The registry validates the content against the schema of the document kind
    (screen.schema.json, datasources.schema.json, navigation.schema.json, theme.schema.json, messages.schema.json) and
    rejects invalid documents.

    0.3: translation catalogues as documents (kind messages, one document per language); review of versions (draft →
    in review → approved or rejected, with the four-eyes principle), protected environments where only approved
    versions are published, saving conditioned by If-Match so as not to overwrite other people's changes, detailed
    validation errors (`errors` in the Problem).

    0.4: check of cross-document references. The navigation (`screen` of its items) and the screens (`navigate` steps,
    `link` nodes with `screen`) cite other screens by identifier: `getReferences` tells which ones and which are
    missing in an environment; in the protected environments a navigation is published only if all its screens are
    published there (otherwise 409 with `missingReferences`). For screens it is only a warning, because links between
    screens often form cycles (list and detail).

    0.5 (not compatible with 0.4): English values. Review states draft, in-review, approved, rejected; actions
    request, approve, reject; sample environments development, testing, production.

    0.6 (compatible with 0.5): data sources as documents of their own (kind datasources, schema datasources.schema.json),
    shared by the screens, which refer to them with {"ref": "orders/list"}. `getReferences` also lists, for screens, the
    data sources documents referred to and those missing in the environment; in the protected environments a screen is
    published only if its data sources documents are published there (otherwise 409 with `missingDataSources`).
  license:
    name: Mozilla Public License 2.0
    identifier: MPL-2.0
servers:
  - url: /
tags:
  - name: registry
    description: Documents of the applications, versions and publication.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /registry/apps:
    get:
      tags: [registry]
      operationId: listApps
      summary: List of the applications visible to the user
      responses:
        '200':
          description: Applications.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppSummary' }
        '401': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents:
    parameters:
      - $ref: '#/components/parameters/AppId'
    get:
      tags: [registry]
      operationId: listDocuments
      summary: Documents of the application (screens, navigation, themes, catalogues)
      parameters:
        - name: kind
          in: query
          required: false
          description: Only the documents of this kind.
          schema: { $ref: '#/components/schemas/DocumentKind' }
      responses:
        '200':
          description: Documents, with the latest version and the environments where they are published.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [registry]
      operationId: listVersions
      summary: Version history of a document
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentVersion' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [registry]
      operationId: saveVersion
      summary: Saves a new (immutable) version of the document
      parameters:
        - name: If-Match
          in: header
          required: false
          description: Hash (in quotes) of the latest version known to the client.
          schema: { type: string }
      description: >
        The content is validated against the schema of the document kind (if it is not valid: 400 with `errors`).
        The identifier in the content (`screen`, `navigation`, `theme` or `messages`) must match `documentId`.
        Saving the same content twice returns the same version. With `If-Match` (the hash of the latest version the
        client knows) the save succeeds only if nobody saved in the meantime; otherwise 412.
        The new version is a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentContent' }
      responses:
        '201':
          description: Version created (or already existing with the same content).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '412':
          description: Another save arrived first; the Problem states `latest` and `latestAuthor`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}/review:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [registry]
      operationId: reviewVersion
      summary: Changes the review state of a version
      description: >
        `request`: from draft or rejected to in-review (anyone who can write). `approve` and `reject`: from in-review to
        approved or rejected; only someone with a reviewer role who is not the author of the version.
        The content of the version never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewRequest' }
      responses:
        '200':
          description: Version with the new state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Action not allowed in the current state (for example approving a draft).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}/references:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
      - name: env
        in: query
        required: false
        description: >
          Environment where the references are checked: missing are the screens without a version published there.
          Without an environment, missing are the screens that do not exist in the application's registry.
        schema: { type: string, examples: [development] }
    get:
      tags: [registry]
      operationId: getReferences
      summary: Screens cited by a version and those that are missing
      description: >
        References by identifier to other screens: `screen` of the navigation items, `navigate` steps and `link`
        nodes with `screen` in screens. A reference of a screen to itself does not count, nor does a value with an
        expression ({{ }}). For screens, also the data sources documents referred to by `ref` in `dataSources`
        (`dataSources` and `missingDataSources`). Themes, data sources and catalogues have no references.
      responses:
        '200':
          description: References of the version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/versions/{hash}:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: hash
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [registry]
      operationId: getVersion
      summary: Content of a version
      responses:
        '200':
          description: Document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /registry/apps/{appId}/documents/{kind}/{documentId}/published:
    parameters:
      - $ref: '#/components/parameters/AppId'
      - $ref: '#/components/parameters/Kind'
      - $ref: '#/components/parameters/DocumentId'
      - name: env
        in: query
        required: true
        schema: { type: string, examples: [production] }
    get:
      tags: [registry]
      operationId: getPublished
      summary: Version of a document published in an environment (with ETag)
      description: This is how the runtime loads every screen, the navigation and the theme, each when needed.
      responses:
        '200':
          description: Published document.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentContent' }
        '304': { description: Not modified. }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [registry]
      operationId: publish
      summary: Publishes a version of the document in an environment
      description: >
        In the protected environments (usually testing and production) only approved versions are published (otherwise
        409) and a navigation is published only if the screens it cites are already published in the same environment
        (otherwise 409 with `missingReferences`); a screen is published there only if the data sources documents it refers to
        are published in the same environment (otherwise 409 with `missingDataSources`). In the other environments
        publishing succeeds anyway: the missing references are read beforehand with `getReferences`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '204': { description: Published. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: >
            Protected environment and version not approved, navigation with screens not published in the environment
            (`missingReferences`) or screen with data sources not published there (`missingDataSources`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LOWCODE_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    Kind:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DocumentKind' }
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Identifier of the document (kebab-case), equal to `screen`, `navigation`, `theme` or `messages` in the content.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
  responses:
    Problem:
      description: Error in RFC 9457 format.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    DocumentKind:
      type: string
      enum: [screen, datasources, navigation, theme, messages]
      description: >
        Document kind, which decides the validation schema (datasources = data sources shared by the screens, schema
        datasources.schema.json; messages = translation catalogue of one language, schema messages.schema.json).
    AppSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        documentCount: { type: integer, minimum: 0 }
    DocumentSummary:
      type: object
      required: [kind, id]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        id: { type: string }
        latest:
          description: Latest saved version.
          $ref: '#/components/schemas/DocumentVersion'
        publishedEnvironments:
          type: object
          description: Environment → hash of the published version.
          additionalProperties: { type: string }
    DocumentContent:
      type: object
      description: >
        The JSON document (a screen, a data sources document, the navigation, a theme or a catalogue), validated against
        the schema of its kind.
      required: [schemaVersion]
      properties:
        schemaVersion: { type: string }
      additionalProperties: true
    DocumentVersion:
      type: object
      required: [hash, createdAt, author]
      properties:
        hash: { type: string, description: Hash of the content. }
        createdAt: { type: string, format: date-time }
        author: { type: string }
        state:
          type: string
          enum: [draft, in-review, approved, rejected]
          description: Review state. Where it is published is stated by `publishedEnvironments` of the document.
        reviewedBy: { type: string, description: Who approved or rejected it. }
        reviewedAt: { type: string, format: date-time }
        reviewNote: { type: string, maxLength: 500 }
    ReviewRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [request, approve, reject] }
        note: { type: string, maxLength: 500 }
    ScreenReference:
      type: object
      required: [screen, path]
      properties:
        screen: { type: string, description: Identifier of the cited screen. }
        path: { type: string, description: Position of the reference in the document (JSON Pointer). }
    DataSourcesReference:
      type: object
      required: [datasources, path]
      properties:
        datasources: { type: string, description: Identifier of the data sources document referred to (orders in orders/list). }
        path: { type: string, description: 'Position of the reference in the screen (JSON Pointer), for example /dataSources/orders/ref.' }
    ReferenceReport:
      type: object
      required: [references, missing]
      properties:
        env: { type: string, description: Environment checked; absent when the check is on existence. }
        references:
          type: array
          description: All the references of the version, in document order.
          items: { $ref: '#/components/schemas/ScreenReference' }
        missing:
          type: array
          description: The references to screens not published in the environment (or that do not exist, without an environment).
          items: { $ref: '#/components/schemas/ScreenReference' }
        dataSources:
          type: array
          description: Screens only. The references to data sources documents, in document order.
          items: { $ref: '#/components/schemas/DataSourcesReference' }
        missingDataSources:
          type: array
          description: Screens only. The references to data sources documents not published in the environment (or that do not exist).
          items: { $ref: '#/components/schemas/DataSourcesReference' }
    PublishRequest:
      type: object
      required: [hash]
      properties:
        hash: { type: string }
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          description: Validation problems of the document (JSON Pointer position and message).
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
        latest: { type: string, description: 'With 412, hash of the latest version.' }
        latestAuthor: { type: string, description: 'With 412, author of the latest version.' }
        missingReferences:
          type: array
          description: With 409 on publication, the screens cited and not published in the environment.
          items: { $ref: '#/components/schemas/ScreenReference' }
        missingDataSources:
          type: array
          description: With 409 on the publication of a screen, the data sources documents not published in the environment.
          items: { $ref: '#/components/schemas/DataSourcesReference' }
