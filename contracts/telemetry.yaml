openapi: 3.1.0
info:
  title: KinetiX - Contratto di ingestione della telemetria
  version: 0.1.0
  description: >
    Endpoint REST a cui il runtime invia tracce e log in formato OTLP/HTTP (JSON).
    Il payload segue la specifica OpenTelemetry; qui si definiscono percorsi, sicurezza e limiti.
    L'endpoint applica una seconda redazione dei dati sensibili e inoltra al collector.
  license:
    name: Proprietaria
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: telemetry
    description: Ingestione di tracce e log.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /telemetry/v1/traces:
    post:
      tags: [telemetry]
      operationId: ingestTraces
      summary: Invio di tracce (OTLP/HTTP JSON)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtlpPayload' }
      responses:
        '202': { description: Accettato per l'elaborazione. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /telemetry/v1/logs:
    post:
      tags: [telemetry]
      operationId: ingestLogs
      summary: Invio di log (OTLP/HTTP JSON)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtlpPayload' }
      responses:
        '202': { description: Accettato per l'elaborazione. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LOWCODE_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Errore in formato RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OtlpPayload:
      type: object
      description: Corpo OTLP/HTTP JSON (resourceSpans oppure resourceLogs), come da specifica OpenTelemetry.
      additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
