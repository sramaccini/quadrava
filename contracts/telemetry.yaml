openapi: 3.1.0
info:
  title: KinetiX - Telemetry ingestion contract
  version: 0.1.0
  description: >
    REST endpoint to which the runtime sends traces and logs in OTLP/HTTP (JSON) format.
    The payload follows the OpenTelemetry specification; this contract defines paths, security and limits.
    The endpoint applies a second redaction of sensitive data and forwards to the collector.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: telemetry
    description: Ingestion of traces and logs.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /telemetry/v1/traces:
    post:
      tags: [telemetry]
      operationId: ingestTraces
      summary: Send traces (OTLP/HTTP JSON)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtlpPayload' }
      responses:
        '202': { description: Accepted for processing. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /telemetry/v1/logs:
    post:
      tags: [telemetry]
      operationId: ingestLogs
      summary: Send logs (OTLP/HTTP JSON)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtlpPayload' }
      responses:
        '202': { description: Accepted for processing. }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LOWCODE_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: Error in RFC 9457 format.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    OtlpPayload:
      type: object
      description: OTLP/HTTP JSON body (resourceSpans or resourceLogs), as in the OpenTelemetry specification.
      additionalProperties: true
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
