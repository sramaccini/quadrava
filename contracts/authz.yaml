openapi: 3.1.0
info:
  title: Quadrava - Authorization contract
  version: 0.2.0
  description: >
    REST contract that every application back end implements to expose the permissions of the current user.
    The front end uses this information only to hide or disable parts of the interface:
    the back end always checks every request and filters the outgoing data.


    **Optional part: operational roles** (0.2, ADR-28). A user may hold several roles and work as one of them at a time.
    `/authz/roles` lists the roles of the user for the application: a **base** role always applies and is not offered
    as a choice; the others are the **operational** roles. With `role` on `/authz/capabilities` and `/authz/check`
    the answer covers the base roles plus that operational role only; a `role` that is not one of the operational roles
    of the user grants nothing beyond the base roles (fail-closed). Without `role` the answer covers all the roles of
    the user, as in 0.1. A service without operational roles answers `404` on `/authz/roles` and ignores `role`.
    A BFF that keeps the active role in the session (bff.yaml) always sends its own `role`, never the page's.
  license:
    name: Mozilla Public License 2.0
    identifier: MPL-2.0
servers:
  - url: /
tags:
  - name: authz
    description: Permissions and authorization checks.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /authz/capabilities:
    get:
      tags: [authz]
      operationId: getCapabilities
      summary: Permissions of the current user for an application
      parameters:
        - name: app
          in: query
          required: true
          description: Identifier of the application.
          schema: { type: string }
        - name: role
          in: query
          required: false
          description: >
            Operational role to answer for (optional part): the permissions of the base roles plus this one. Without it,
            those of all the roles of the user.
          schema: { type: string }
      responses:
        '200':
          description: List of the granted permissions.
          headers:
            X-Permissions-Version:
              $ref: '#/components/headers/PermissionsVersion'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /authz/roles:
    get:
      tags: [authz]
      operationId: getRoles
      summary: Roles of the current user for an application (optional)
      description: >
        The roles of the user that the authorization service knows for the application, with their label and whether
        they are base roles. The operational roles (`base: false`) are those the user can work as, one at a time.
        Roles the service gives no permissions to are left out. A service without operational roles answers `404`.
      parameters:
        - name: app
          in: query
          required: true
          description: Identifier of the application.
          schema: { type: string }
      responses:
        '200':
          description: The roles of the user, base and operational.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /authz/check:
    post:
      tags: [authz]
      operationId: checkPermissions
      summary: Batch check of permission/resource pairs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
      responses:
        '200':
          description: Result of every requested check, in the same order.
          headers:
            X-Permissions-Version:
              $ref: '#/components/headers/PermissionsVersion'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LC_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  headers:
    PermissionsVersion:
      description: Current version of the user's permissions. When it changes, the runtime reloads the capabilities.
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Session missing or expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Operation not allowed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: The service has no operational roles (optional part not implemented).
  schemas:
    Permission:
      type: string
      description: Format domain.resource.action, lower case.
      pattern: '^[a-z0-9]+\.[a-z0-9]+\.[a-z0-9]+$'
      examples: ['orders.order.approve']
    Capabilities:
      type: object
      required: [permissions, version]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        version:
          type: string
        ttlSeconds:
          type: integer
          minimum: 0
          description: Suggested cache duration.
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
    CheckItem:
      type: object
      required: [permission]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        resource: { $ref: '#/components/schemas/ResourceRef' }
    CheckRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CheckItem' }
        role:
          type: string
          description: >
            Operational role to answer for (optional part): the permissions of the base roles plus this one. Without it,
            those of all the roles of the user.
    Role:
      type: object
      required: [id, label, base]
      properties:
        id:
          type: string
          description: Identifier of the role, sent back as `role`.
        label:
          type: string
          description: Name shown to the user, as text.
        base:
          type: boolean
          description: True for a role that always applies and is not offered as a choice; false for an operational role.
    CheckResult:
      type: object
      required: [permission, allowed]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        resource: { $ref: '#/components/schemas/ResourceRef' }
        allowed: { type: boolean }
    CheckResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/CheckResult' }
    Problem:
      type: object
      description: Error in RFC 9457 format, with a correlation identifier.
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
