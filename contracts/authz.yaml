openapi: 3.1.0
info:
  title: KinetiX - Authorization contract
  version: 0.1.0
  description: >
    REST contract that every application back end implements to expose the permissions of the current user.
    The front end uses this information only to hide or disable parts of the interface:
    the back end always checks every request and filters the outgoing data.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
tags:
  - name: authz
    description: Permissions and authorization checks.
security:
  - cookieAuth: []
  - bearerAuth: []
paths:
  /authz/capabilities:
    get:
      tags: [authz]
      operationId: getCapabilities
      summary: Permissions of the current user for an application
      parameters:
        - name: app
          in: query
          required: true
          description: Identifier of the application.
          schema: { type: string }
      responses:
        '200':
          description: List of the granted permissions.
          headers:
            X-Permissions-Version:
              $ref: '#/components/headers/PermissionsVersion'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /authz/check:
    post:
      tags: [authz]
      operationId: checkPermissions
      summary: Batch check of permission/resource pairs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckRequest' }
      responses:
        '200':
          description: Result of every requested check, in the same order.
          headers:
            X-Permissions-Version:
              $ref: '#/components/headers/PermissionsVersion'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: LOWCODE_SESSION }
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  headers:
    PermissionsVersion:
      description: Current version of the user's permissions. When it changes, the runtime reloads the capabilities.
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Session missing or expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Operation not allowed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Permission:
      type: string
      description: Format domain.resource.action, lower case.
      pattern: '^[a-z0-9]+\.[a-z0-9]+\.[a-z0-9]+$'
      examples: ['ordini.ordine.approva']
    Capabilities:
      type: object
      required: [permissions, version]
      properties:
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        version:
          type: string
        ttlSeconds:
          type: integer
          minimum: 0
          description: Suggested cache duration.
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: string }
    CheckItem:
      type: object
      required: [permission]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        resource: { $ref: '#/components/schemas/ResourceRef' }
    CheckRequest:
      type: object
      required: [checks]
      properties:
        checks:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/CheckItem' }
    CheckResult:
      type: object
      required: [permission, allowed]
      properties:
        permission: { $ref: '#/components/schemas/Permission' }
        resource: { $ref: '#/components/schemas/ResourceRef' }
        allowed: { type: boolean }
    CheckResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/CheckResult' }
    Problem:
      type: object
      description: Error in RFC 9457 format, with a correlation identifier.
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        correlationId: { type: string }
