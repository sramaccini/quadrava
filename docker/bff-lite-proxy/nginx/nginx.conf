# Main configuration of nginx for the light BFF: the njs module and the server of templates/bff.conf.template, which the
# image writes to /etc/nginx/bff with the variables of the environment.
load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /dev/stderr notice;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # No tokens, cookies or query strings in the log: only the path.
  log_format bff '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout bff;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  # QuickJS: the JavaScript of today in bff.js (for…of, async functions).
  js_engine qjs;
  js_path /etc/nginx/njs/;
  js_import bff from bff.js;

  include /etc/nginx/bff/*.conf;
}
