# The runtime: static files, every unknown path to index.html (the routes of the screens), the configuration never
# cached. With QUADRAVA_BFF_URL the start-up script adds the paths of the BFF in /etc/nginx/quadrava/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The answers of the BFF get these headers and keep their own: the policy of the page (Content-Security-Policy)
    # is in security-headers.conf, for the files of the runtime only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    include /etc/nginx/quadrava/hsts.inc;

    location = /runtime-config.json {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/quadrava-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/quadrava-security-headers.conf;
    }

    # The bundles have the hash of their content in the name: they never change.
    # Quoted: nginx would read the braces of the regex as a block.
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/quadrava-security-headers.conf;
    }

    include /etc/nginx/quadrava/*.conf;

    location / {
        include /etc/nginx/snippets/quadrava-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
