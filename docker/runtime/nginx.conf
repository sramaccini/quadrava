# The runtime: static files, every unknown path to index.html (the routes of the screens), the configuration never
# cached. With QUADRAVA_BFF_URL the start-up script adds the paths of the BFF in /etc/nginx/quadrava/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /runtime-config.json {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # The bundles have the hash of their content in the name: they never change.
    location ~* -[A-Z0-9]{8}\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    include /etc/nginx/quadrava/*.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
