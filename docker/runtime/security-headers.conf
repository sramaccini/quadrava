# The headers of the files of the runtime, included by every location of nginx.conf that serves them: a location with
# its own add_header does not inherit those of the server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Everything from the same origin: the browser talks only to the BFF. No inline scripts and no eval (the validators are
# precompiled). Style elements need the nonce of the answer ($request_id, which nginx.conf also writes in index.html as
# ngCspNonce: Angular, NG-ZORRO and the theme put it on the style elements they add). Style attributes stay allowed:
# NG-ZORRO writes some in its templates (the list of nz-tree), and an attribute holds declarations for one element,
# not selectors that could read the page. Images from the same origin and data: addresses, plus QUADRAVA_CSP_IMG_SRC.
# The pages may be framed only by the same origin, as X-Frame-Options says.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; style-src-attr 'unsafe-inline'; img-src $quadrava_img_src; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# Strict-Transport-Security when QUADRAVA_HSTS is set, written by the start-up script.
include /etc/nginx/quadrava/hsts.inc;
