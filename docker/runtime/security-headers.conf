# The headers of the files of the runtime, included by every location of nginx.conf that serves them: a location with
# its own add_header does not inherit those of the server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Everything from the same origin: the browser talks only to the BFF. No inline scripts and no eval (the validators are
# precompiled); inline styles are needed by the components (Angular and NG-ZORRO add style elements). Images may also
# come from https and data: addresses. The pages may be framed only by the same origin, as X-Frame-Options says.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
# Strict-Transport-Security when QUADRAVA_HSTS is set, written by the start-up script.
include /etc/nginx/quadrava/hsts.inc;
