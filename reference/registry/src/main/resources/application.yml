server:
  port: 8081

spring:
  application:
    name: lowcode-registry
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}
          # Autore delle versioni: il nome utente, non l'identificativo interno di Keycloak.
          principal-claim-name: preferred_username

management:
  endpoints:
    web:
      exposure:
        include: health

lowcode:
  registry:
    # Cartella dell'archivio su file (vuota = in memoria, si perde al riavvio). Per esempio data/registry.
    storage-dir: ${LOWCODE_REGISTRY_DIR:}
    # Qui si pubblicano solo versioni approvate.
    protected-environments: [collaudo, produzione]
    # Ruoli del realm che possono approvare o respingere (mai l'autore della versione).
    approver-roles: [responsabile, amministratore]
