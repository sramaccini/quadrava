server:
  port: 8081

spring:
  application:
    name: lowcode-registry
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}
          # Author of the versions: the user name, not Keycloak's internal identifier.
          principal-claim-name: preferred_username

management:
  endpoints:
    web:
      exposure:
        include: health

lowcode:
  registry:
    # Folder of the file store (empty = in memory, lost on restart). For example data/registry.
    storage-dir: ${LOWCODE_REGISTRY_DIR:}
    # Only approved versions are published here.
    protected-environments: [testing, production]
    # Realm roles that can approve or reject (never the author of the version).
    approver-roles: [manager, administrator]
