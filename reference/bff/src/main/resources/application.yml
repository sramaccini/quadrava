server:
  port: 8080

spring:
  application:
    name: lowcode-bff
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: lowcode-bff
            client-secret: ${LOWCODE_BFF_CLIENT_SECRET:dev-only-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        # Explicit addresses instead of discovery at start-up (issuer-uri): the BFF starts even if Keycloak is not up
        # yet. They are the standard Keycloak ones under the realm issuer.
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

lowcode:
  bff:
    # APIs forwarded by the BFF to the services, with the user's token. Only these prefixes and these hosts.
    routes:
      - prefix: /registry
        target: ${LOWCODE_REGISTRY_URL:http://localhost:8081}
      - prefix: /authz
        target: ${LOWCODE_AUTHZ_URL:http://localhost:8082}
      - prefix: /telemetry
        target: ${LOWCODE_TELEMETRY_URL:http://localhost:8083}
      # Back end of the application: in the demo the sample server (frontend/tools/demo-api.mjs).
      - prefix: /api
        target: ${LOWCODE_API_URL:http://localhost:8084}
    # Applications the user may return to after the login (/bff/login?return=...).
    frontend-origins:
      - http://localhost:4200
      - http://localhost:4201
      # The runtime image in front of this BFF (docker/runtime/README.md, «Against the local stack»).
      - http://localhost:8090
    # After a login without a return page, and when opening the BFF root.
    home: ${LOWCODE_HOME:http://localhost:4200/}
    # Signing out also closes the session in Keycloak.
    end-session-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/logout
    # Optional tenants (contracts/bff.yaml): the user switches with POST /bff/tenant, the services receive X-Tenant.
    # Without users a tenant is offered to everybody. The runtime shows the choice only with services.tenantSwitchUrl.
    # tenants:
    #   - id: north
    #     label: North office
    #     users: [administrator]
    #   - id: south
    #     label: South office
    #     users: [administrator, operator]

management:
  endpoints:
    web:
      exposure:
        include: health
