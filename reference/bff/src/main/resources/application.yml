server:
  port: 8080
  servlet:
    session:
      # Inactivity timeout (sliding); the absolute limit is authz.bff.session.absolute-timeout.
      timeout: 30m

spring:
  application:
    name: quadrava-reference-bff
  # The sessions are kept in Redis (Spring Session), so that Keycloak can close them with the back-channel logout.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  session:
    data:
      redis:
        namespace: quadrava-bff
        # indexed: sessions found by user, for the back-channel logout and the revocation.
        repository-type: indexed
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: quadrava-bff
            client-secret: ${QUADRAVA_BFF_CLIENT_SECRET:dev-only-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            # Discovery at start-up: the logout address and the keys of the logout tokens come from Keycloak, which
            # must be up before the BFF (npm run stack waits for it).
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/quadrava}
            user-name-attribute: preferred_username

authz:
  bff:
    oidc:
      registration-id: keycloak
    frontend:
      # After a login without a return page, after a failed login (with ?error=) and after signing out.
      login-success-url: ${LC_HOME:http://localhost:4200/}
      login-failure-url: ${LC_HOME:http://localhost:4200/}
      post-logout-url: ${LC_HOME:http://localhost:4200/}
      # Applications the user may return to after the login (/bff/login?return=...) and Origin allowed on writes.
      allowed-origins:
        - http://localhost:4200
        - http://localhost:4201
        # The runtime image in front of this BFF (docker/runtime/README.md, «Against the local stack»).
        - http://localhost:8090
    session:
      absolute-timeout: 10h
    # The access token of the user stays in the session, for the services behind the routes.
    token-relay:
      enabled: true
    # Keycloak closes the sessions of the BFF when it closes its own (sign-out elsewhere, administrator).
    backchannel-logout:
      enabled: true

quadrava:
  bff:
    # APIs forwarded by the BFF to the services, with the user's token. Only these prefixes and these hosts. The
    # permissions (/authz/capabilities, /authz/check) are answered by the BFF itself, from the session.
    routes:
      - prefix: /registry
        target: ${LC_REGISTRY_URL:http://localhost:8081}
      - prefix: /telemetry
        target: ${LC_TELEMETRY_URL:http://localhost:8083}
      # Back end of the application: in the demo the sample server (frontend/tools/demo-api.mjs).
      - prefix: /api
        target: ${LC_API_URL:http://localhost:8084}
    # Roles of the users of the realm (idp/realm-quadrava.json). A user who is not listed cannot sign in.
    users:
      operator: [user, operator]
      manager: [user, manager]
      administrator: [user, manager, administrator]
    # Label and base flag of the roles (ADR-28), as in the reference authz service: a base role always applies, the
    # others are operational roles, of which the user works as one at a time (POST /bff/role; the runtime shows the
    # choice with services.roleSwitchUrl). The administrator holds two operational ones.
    roles:
      user:
        label: User
        base: true
      operator:
        label: Operator
      manager:
        label: Manager
      administrator:
        label: Administrator
    # Permissions of the roles (domain.resource.action): the same map as the reference authz service.
    role-permissions:
      user:
        - showcase.components.read
      operator:
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
      manager:
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
        - orders.order.write
        - orders.order.approve
        - packages.package.read
        - packages.package.create
        - expenses.expense.read
        - expenses.expense.review
      administrator:
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
        - orders.order.write
        - orders.order.approve
        - orders.iban.read
        - orders.iban.write
        - packages.package.read
        - packages.package.create
        - expenses.expense.read
        - expenses.expense.review
    # Optional tenants (contracts/bff.yaml): the user switches with POST /bff/tenant, the services receive X-Tenant.
    # Without users a tenant is offered to everybody. The runtime shows the choice only with services.tenantSwitchUrl.
    # tenants:
    #   - id: north
    #     label: North office
    #     users: [administrator]
    #   - id: south
    #     label: South office
    #     users: [administrator, operator]

management:
  endpoints:
    web:
      exposure:
        include: health
