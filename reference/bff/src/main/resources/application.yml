server:
  port: 8080

spring:
  application:
    name: lowcode-bff
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: lowcode-bff
            client-secret: ${LOWCODE_BFF_CLIENT_SECRET:dev-only-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        # Indirizzi espliciti invece della scoperta all'avvio (issuer-uri): il BFF parte anche se Keycloak non è
        # ancora acceso. Sono quelli standard di Keycloak sotto l'issuer del realm.
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/auth
            token-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/certs
            user-info-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

lowcode:
  bff:
    # API inoltrate dal BFF ai servizi, con il token dell'utente. Solo questi prefissi e questi host.
    routes:
      - prefix: /registry
        target: ${LOWCODE_REGISTRY_URL:http://localhost:8081}
      - prefix: /authz
        target: ${LOWCODE_AUTHZ_URL:http://localhost:8082}
      - prefix: /telemetry
        target: ${LOWCODE_TELEMETRY_URL:http://localhost:8083}
      # Backend dell'applicazione: nella demo il server di esempio (frontend/tools/demo-api.mjs).
      - prefix: /api
        target: ${LOWCODE_API_URL:http://localhost:8084}
    # Applicazioni verso cui si torna dopo il login (/bff/login?return=...).
    frontend-origins:
      - http://localhost:4200
      - http://localhost:4201
    # Dopo un login senza pagina di ritorno, e aprendo la radice del BFF.
    home: ${LOWCODE_HOME:http://localhost:4200/}
    # Uscendo si chiude anche la sessione in Keycloak.
    end-session-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}/protocol/openid-connect/logout

management:
  endpoints:
    web:
      exposure:
        include: health
