server:
  port: 8082

spring:
  application:
    name: lowcode-authz
  # Framework errors (missing parameter, unreadable body) in Problem format (RFC 9457), as the contract says.
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}

management:
  endpoints:
    web:
      exposure:
        include: health

# Role → permissions map of the sample application (domain.resource.action format).
lowcode:
  authz:
    role-permissions:
      operator:
        - showcase.components.read
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
      manager:
        - showcase.components.read
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
        - orders.order.write
        - orders.order.approve
        - packages.package.read
        - packages.package.create
        - expenses.expense.read
        - expenses.expense.review
      administrator:
        - showcase.components.read
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
        - orders.order.write
        - orders.order.approve
        - orders.iban.read
        - orders.iban.write
        - packages.package.read
        - packages.package.create
        - expenses.expense.read
        - expenses.expense.review
