server:
  port: 8082

spring:
  application:
    name: quadrava-reference-authz
  # Framework errors (missing parameter, unreadable body) in Problem format (RFC 9457), as the contract says.
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/quadrava}

management:
  endpoints:
    web:
      exposure:
        include: health

# Roles of the sample application (ADR-28): a base role always applies; the others are operational roles, of which the
# user works as one at a time when the BFF asks for it (role on /authz/capabilities and /authz/check). The roles come
# from the token (realm_access.roles of idp/realm-quadrava.json); the administrator holds two operational ones.
quadrava:
  authz:
    roles:
      user:
        label: User
        base: true
      operator:
        label: Operator
      manager:
        label: Manager
      administrator:
        label: Administrator
    # Role → permissions map (domain.resource.action format). Without a role in the request, the user has those of all
    # their roles.
    role-permissions:
      user:
        - showcase.components.read
      operator:
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
      manager:
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
        - orders.order.write
        - orders.order.approve
        - packages.package.read
        - packages.package.create
        - expenses.expense.read
        - expenses.expense.review
      administrator:
        - invoices.invoice.read
        - invoices.invoice.create
        - orders.order.read
        - orders.order.write
        - orders.order.approve
        - orders.iban.read
        - orders.iban.write
        - packages.package.read
        - packages.package.create
        - expenses.expense.read
        - expenses.expense.review
