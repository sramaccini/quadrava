server:
  port: 8082

spring:
  application:
    name: lowcode-authz
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}

management:
  endpoints:
    web:
      exposure:
        include: health

# Mappa ruolo -> permessi dell'applicazione di esempio (formato dominio.risorsa.azione).
lowcode:
  authz:
    role-permissions:
      operatore:
        - vetrina.componenti.leggi
        - fatture.fattura.leggi
        - fatture.fattura.crea
        - ordini.ordine.leggi
      responsabile:
        - vetrina.componenti.leggi
        - fatture.fattura.leggi
        - fatture.fattura.crea
        - ordini.ordine.leggi
        - ordini.ordine.scrivi
        - ordini.ordine.approva
        - pacchetti.pacchetto.leggi
        - pacchetti.pacchetto.crea
        - spese.spesa.leggi
        - spese.spesa.revisiona
      amministratore:
        - vetrina.componenti.leggi
        - fatture.fattura.leggi
        - fatture.fattura.crea
        - ordini.ordine.leggi
        - ordini.ordine.scrivi
        - ordini.ordine.approva
        - ordini.iban.leggi
        - ordini.iban.scrivi
        - pacchetti.pacchetto.leggi
        - pacchetti.pacchetto.crea
        - spese.spesa.leggi
        - spese.spesa.revisiona
