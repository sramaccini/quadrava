server:
  port: 8082

spring:
  application:
    name: lowcode-authz
  # Framework errors (missing parameter, unreadable body) in Problem format (RFC 9457), as the contract says.
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}

management:
  endpoints:
    web:
      exposure:
        include: health

# Role → permissions map of the sample application (domain.resource.action format).
lowcode:
  authz:
    role-permissions:
      operator:
        - vetrina.componenti.leggi
        - fatture.fattura.leggi
        - fatture.fattura.crea
        - ordini.ordine.leggi
      manager:
        - vetrina.componenti.leggi
        - fatture.fattura.leggi
        - fatture.fattura.crea
        - ordini.ordine.leggi
        - ordini.ordine.scrivi
        - ordini.ordine.approva
        - pacchetti.pacchetto.leggi
        - pacchetti.pacchetto.crea
        - spese.spesa.leggi
        - spese.spesa.revisiona
      administrator:
        - vetrina.componenti.leggi
        - fatture.fattura.leggi
        - fatture.fattura.crea
        - ordini.ordine.leggi
        - ordini.ordine.scrivi
        - ordini.ordine.approva
        - ordini.iban.leggi
        - ordini.iban.scrivi
        - pacchetti.pacchetto.leggi
        - pacchetti.pacchetto.crea
        - spese.spesa.leggi
        - spese.spesa.revisiona
