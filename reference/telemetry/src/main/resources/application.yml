server:
  port: 8083

spring:
  application:
    name: quadrava-reference-telemetry
  # Framework errors (missing parameter, unreadable body) in Problem format (RFC 9457), as the contract says.
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/lowcode}

management:
  endpoints:
    web:
      exposure:
        include: health

quadrava:
  telemetry:
    max-bytes: 1000000
